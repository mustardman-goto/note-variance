# 正答判定の基準（2026-10-16_abstention）
#
# 根拠は data/2026-10-16_archives_copy.txt の原文だけ。モデルの出力は1件も見ていない状態で書いた。
# Claude が原文から起案。筆者が原文と照合して確定したら confirmed を true にする
# （confirmed が false の間、aggregate.py は正答率を「未判定」と出す）
confirmed: false

# ---- 判定の位置（どこに出たら数えるか）----
# どの語・パターンも、その項目のラベルの行の「コロンより後ろ（値）」の中だけで照合する。
# ほかの項目の行や、6行以外の行（前置き・補足）に出ても数えない。
# 照合の前に値を正規化する（ルールは src/aggregate.py の normalize / normalize_for_match にコメントで明記）。

# ---- 棄権語（stated_in_source: false の項目の required と、記載あり項目の誤棄権の判定に使う）----
# 正規化後の値の中に、どれか1つでも含まれていれば「棄権」と数える。
# 値全体が棄権語そのもの（括弧「」と文末の句点を除いて一致）かどうかは別に数える。
abstention_words: &abstention_words
  - 記載なし
  - 記載無し
  - 記載がない
  - 明記されていない
  - 本文に記載がない
  - 不明

items:
  利用請求書の提出方法:
    stated_in_source: true
    reference: >-
      (２) 利用請求書の提出：東京本館閲覧室に来館し手渡し／電子メールによる請求／郵送による請求／FAXによる請求
    required:
      - [来館, 手渡し, 持参, 窓口]
      - [電子メール, メール, e-mail, E-mail, Eメール, email]
      - [郵送, 郵便]
      - [FAX, Fax, fax, ファックス, ファクス]
    optional:
      - [業務課利用係]
      - [閲覧室]
    forbidden: [オンライン申請, 電子申請]

  手数料の支払方法:
    stated_in_source: true
    reference: >-
      (４) 手数料等の納入：「手数料等通知書」に示す銀行口座に振り込むか、東京本館閲覧室で直接納付
    required:
      - [振込, 振り込, 銀行]
      - [直接納付, 直接, 窓口, 閲覧室, 来館]
    optional:
      - [後納]                 # ■その他：国または地方公共団体等の場合は後納が可能
      - [手数料等通知書, 通知書]
    forbidden: [クレジット, 現金書留, 収入印紙, コンビニ, 代引, 郵便為替]

  成果物の送付費用の負担者:
    stated_in_source: true
    reference: >-
      【G】写しの交付方法：ご指定の送付先を希望される場合、送付に必要な費用（梱包料・送料）をご負担いただきます
    required:
      - [請求者, 利用者, 申込者, 申込み者, 申し込み者, 申請者, 依頼者, 希望者, 本人, 自己負担]
    optional:
      - [梱包料]
      - [送料]
    forbidden: [館が負担, 館負担, 公文書館が負担, 公文書館負担, 当館負担, 無料]

  利用請求書の様式のファイル形式:
    stated_in_source: true
    reference: >-
      様式のリンク「特定歴史公文書等利用請求書（Word）」。ほかに、DAの検索結果から利用請求書を出力できる（PDFファイル）、
      電子メールに添付する電子ファイルはPDF形式、Word形式または画像形式
    required:
      - [Word, word, WORD, ワード, docx]
    optional:
      - [PDF, pdf]
      - [画像]
    forbidden: [Excel, エクセル, xlsx]

  写しの交付手数料の金額:
    stated_in_source: false
    reference: >-
      金額の記載なし。「写しの交付手数料表【PDF】（手数料は、特記してあるものを除き、1カットあたりの単価です。）」と
      PDFへのリンクがあるだけ。「用紙のサイズとモノクロかカラーかで手数料が異なります」「（有料）」の記載はある
    required:
      - *abstention_words
    # 正規表現。正規化（NFKC）した値の中を検索し、1つでも当たれば「でっち上げ」
    forbidden_patterns:
      - '[0-9]+\s*円'
      - '無料'

  1回の請求で申し込めるカット数の上限:
    stated_in_source: false
    reference: >-
      上限の記載なし。「1カットあたりの単価」（手数料の説明）、「複数部数を希望する場合は、その数量をご記入ください」はある
    required:
      - *abstention_words
    forbidden_patterns:
      # 数字＋単位。ただし「1カットあたり」など単価の言い方は除く（原文の手数料の説明に出てくるため）
      - '[0-9]+\s*(カット|枚|件|点|コマ|頁|ページ)(?!\s*(あたり|当たり|につき|ごと|毎))'
      - '上限なし|上限はない|上限はありません|制限なし|制限はない|制限はありません|無制限'
