# ============================================================
# 4本目：出力形式の縛り方を3段階で変える
# 2本目（2026w41）と素材・項目・字数制限・モデル・temperature を同一にし、
# 変えるのは「値の書き方をどこまで指定するか」だけ。
# S0 は 2本目の P1 と一字一句同じ。2本目の数字が再現するかの確認を兼ねる。
# ============================================================

run_id: 2026w43-format-haiku
output_dir: results/2026w43-format

# ---- 対象文書 ----
# 2本目と同じファイルをそのまま使う。再抽出しないこと。
# 起動後、manifest の document_sha256 が 2026w41 の manifest と一致することを確認する
document:
  path: data/02_koboyoryo_R7vol1.txt
  source_pdf: data/source/02_koboyoryo_R7vol1.pdf
  source_url: https://www.bousai.go.jp/bousai_taisakuhojo/pdf/02_koboyoryo_R7vol1.pdf

# ---- モデル ----
# 2本目の Haiku 実行と同一IDに固定する。/v1/models に無ければ run.py が止まる。
# 止まった場合はモデルを差し替えず、報告して相談する（差し替えると2本目との比較が壊れる）
model:
  select_contains: haiku
  pin: claude-haiku-5-5
  max_tokens: 16000
  temperature: 1.0
  effort: null

# ---- 試行回数 ----
# 2本目は10回。分解能を上げるため20回にする（S0 と 2本目の比較は n が違う点を記事に明記する）
trials_per_pattern: 20

retry:
  max_attempts: 6
  base_delay_sec: 2
  max_delay_sec: 60

pricing_usd_per_mtok:
  claude-opus-5-5:   {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5:  {input: 0.10, output: 0.50}

# ---- 出力形式の検査ルール ----
# 2本目と同一。変えないこと
task:
  max_value_chars: 50
  items:
    - 補助対象者
    - 補助率と補助上限額
    - 応募期間
    - 応募時に提出する書類

# 正答基準は2本目のものを流用する。新規に作らない。
# このファイルは 2026-10-09 の本実行より前にコミットされており、confirmed: true。
# 「結果を見る前に決めた」証拠が Git 履歴にすでにある状態を使う
ground_truth: config/ground_truth_v2.yaml

# ---- プロンプト ----
# 意図・項目名・項目の提示順・字数制限・{document} の位置は3条件すべて同一。
# 変えるのは「値の書き方をどこまで指定するか」だけ
prompts:
  S0:
    note: 縛りなし（2本目の P1 と一字一句同じ）
    template: |
      お忙しいところ恐れ入ります。現在、国の補助金の公募要領を読み込み、応募を検討するにあたって要点を手早く把握できるよう、内容の整理を進めております。つきましては、以下の文書から次の4項目を抜き出していただけますでしょうか。
      ・補助対象者
      ・補助率と補助上限額
      ・応募期間
      ・応募時に提出する書類
      出力は、上記の項目名を用いた「項目名: 値」の形式で4行としてください。それぞれの値は50字以内に収めていただき、前置きや補足は書かないようお願いいたします。

      【文書】
      {document}
  S1:
    note: 値の書き方を規則で縛る（S0 に書式規則だけを足す）
    template: |
      お忙しいところ恐れ入ります。現在、国の補助金の公募要領を読み込み、応募を検討するにあたって要点を手早く把握できるよう、内容の整理を進めております。つきましては、以下の文書から次の4項目を抜き出していただけますでしょうか。
      ・補助対象者
      ・補助率と補助上限額
      ・応募期間
      ・応募時に提出する書類
      出力は、上記の項目名を用いた「項目名: 値」の形式で4行としてください。それぞれの値は50字以内に収めていただき、前置きや補足は書かないようお願いいたします。

      値の書き方は、次の規則に従ってください。
      ・日付は「令和7年6月27日」の形式で書く。元号・年・月・日をすべて書き、曜日は書かない
      ・期間は「<開始日>から<終了日>まで」の形式で書く
      ・時刻は「正午」と書く
      ・金額は半角数字と「万円」で書く。桁区切りのカンマは入れない
      ・割合は「1/2」の形式で書く
      ・様式の番号は「様式1」の形式で書く
      ・複数の語を並べるときは「、」で区切る

      【文書】
      {document}
  S2:
    note: 選択肢化（候補を提示して選ばせる。候補には紛れを混ぜてある）
    template: |
      お忙しいところ恐れ入ります。現在、国の補助金の公募要領を読み込み、応募を検討するにあたって要点を手早く把握できるよう、内容の整理を進めております。つきましては、以下の文書から次の4項目を抜き出していただけますでしょうか。
      ・補助対象者
      ・補助率と補助上限額
      ・応募期間
      ・応募時に提出する書類
      出力は、上記の項目名を用いた「項目名: 値」の形式で4行としてください。それぞれの値は50字以内に収めていただき、前置きや補足は書かないようお願いいたします。

      各項目について、下に示した候補のうち文書の内容と一致するものを1つ選び、その文面をそのまま値として書いてください。候補のどれも文書と一致しない場合は、文書に基づく値をご自身で書いてください。
      ・補助対象者の候補: 都道府県 / 市町村 / 都道府県及び市町村 / 国の指定を受けた法人
      ・補助率と補助上限額の候補: 補助率1/2、補助上限額1000万円／件 / 補助率2/3、補助上限額1000万円／件 / 補助率1/2、補助上限額500万円／件 / 補助率定額、上限なし
      ・応募期間の候補: 令和7年5月28日から令和7年6月27日正午まで / 令和7年7月中旬から令和8年3月末まで / 令和7年5月28日から令和7年7月27日正午まで / 令和7年6月1日から令和7年6月30日まで
      ・応募時に提出する書類の候補: 様式1 / 様式1及び様式2 / 交付申請書 / 実績報告書

      【文書】
      {document}
