# 正答判定の基準（原文と照合して人が決める）
#
# 判定ルール：
#   required  … 各行（グループ）から最低1つの語が、値に含まれていれば正解
#               （全角/半角・空白の違いは無視して照合する）
#   forbidden … ここに書いた語が1つでも含まれていたら不正解
#
# confirmed が true になるまで、aggregate.py は正答率を「未判定」と出す
# 2026-10-09 本実行の前（結果を見る前）に確定
confirmed: true

items:
  補助対象者:
    reference: 都道府県                      # 原文 ２.（１）
    required:
      - [都道府県]
    forbidden: [市町村, 市区町村]

  補助率と補助上限額:
    reference: 補助率１／２、補助上限額1,000万円／件   # 原文 ２.（２）
    required:
      - ["1/2", 2分の1, 二分の一, "50%"]
      - ["1,000万円", 1000万円, 1千万円, 一千万円]

  応募期間:
    reference: 令和７年５月28日（水）から令和７年６月27日（金）正午まで（必着）   # 原文 ３.（１）
    required:
      - [5月28日]
      - [6月27日]
      - [正午, "12時", "12:00"]

  応募時に提出する書類:
    reference: 応募書類【様式１】（申請者連絡先等、補助対象業務の内容、補助対象業務に関する経費、工程表）  # 原文 ３.（２）
    required:
      - [様式1]
