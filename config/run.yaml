# ============================================================
# 検証設定。毎週ここだけ書き換える（src/ のコードは触らない）
# ============================================================

# 実行の名前。results/raw/<run_id>.jsonl に保存される。
# 週が変わったら必ず変える（同じ名前だと前回の続きとして再開される）
run_id: 2026w41-bousai-koboyoryo

# ---- 対象文書 ----
document:
  path: data/02_koboyoryo_R7vol1.txt          # src/extract_pdf.py で作ったテキスト
  source_pdf: data/source/02_koboyoryo_R7vol1.pdf
  source_url: https://www.bousai.go.jp/bousai_taisakuhojo/pdf/02_koboyoryo_R7vol1.pdf

# ---- モデル ----
model:
  # 起動時に /v1/models の一覧を取得し、ID にこの文字列を含むもののうち
  # 公開日（created_at）が最も新しいものを使う。例: opus / sonnet / haiku
  select_contains: haiku
  # 特定のIDに固定したいときだけ書く（一覧に存在するかは起動時に確認する）。通常は null
  pin: null
  max_tokens: 16000
  # API に送る temperature。null にすると送らない（＝API側の既定に任せる）。
  # モデルによっては送るとエラーになる。実際に送ったかどうかは 1件ごとにログに残る
  temperature: 1.0
  # 思考の深さ（low / medium / high / xhigh / max）。null は送らない（＝モデルの既定）
  effort: null

# ---- 試行回数 ----
trials_per_pattern: 10

# ---- リトライ（レート制限・サーバーエラー・通信エラーのとき） ----
retry:
  max_attempts: 6        # 1試行あたり最大何回まで API を呼ぶか
  base_delay_sec: 2      # 待ち時間 = base × 2^(回数-1) ＋ ゆらぎ
  max_delay_sec: 60

# ---- コスト試算用の単価（USD / 100万トークン）。料金表から手で転記 ----
# モデルIDが左の文字列で始まるものに適用。該当なしならコストは「不明」と出す
pricing_usd_per_mtok:
  claude-opus-5-5:   {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5:  {input: 0.10, output: 0.50}

# ---- 出力形式の検査ルール（aggregate.py が使う） ----
task:
  max_value_chars: 50
  # 出力の「項目名」。プロンプト内の表記と一字一句そろえること
  items:
    - 補助対象者
    - 補助率と補助上限額
    - 応募期間
    - 応募時に提出する書類

# 正答判定の基準ファイル（無ければ正答率と揺れの分類の一部は「未判定」になる）
# ファイル名の ground_truth_ より後ろ（v2 など）が、集計結果のファイル名の末尾に付く
ground_truth: config/ground_truth_v2.yaml

# ---- プロンプト ----
# {document} の位置に対象文書の全文が入る。
# 意図・要求項目・項目名・出力形式・字数制限は全パターン同一。変えるのは表現だけ
prompts:
  P1:
    note: 丁寧な長文（背景と目的を説明してから依頼）
    template: |
      お忙しいところ恐れ入ります。現在、国の補助金の公募要領を読み込み、応募を検討するにあたって要点を手早く把握できるよう、内容の整理を進めております。つきましては、以下の文書から次の4項目を抜き出していただけますでしょうか。
      ・補助対象者
      ・補助率と補助上限額
      ・応募期間
      ・応募時に提出する書類
      出力は、上記の項目名を用いた「項目名: 値」の形式で4行としてください。それぞれの値は50字以内に収めていただき、前置きや補足は書かないようお願いいたします。

      【文書】
      {document}
  P2:
    note: 簡潔な命令形（1文）
    template: |
      以下の文書から補助対象者、補助率と補助上限額、応募期間、応募時に提出する書類の4項目を抽出し、その項目名を用いた「項目名: 値」の4行（各値50字以内、前置き・補足なし）で出力せよ。

      【文書】
      {document}
  P3:
    note: 4項目の提示順を入れ替え
    template: |
      以下の文書から次の4項目を抽出してください。
      ・応募時に提出する書類
      ・応募期間
      ・補助率と補助上限額
      ・補助対象者
      出力は、上記の項目名を用いた「項目名: 値」の形式で4行にしてください。各値は50字以内とし、前置きや補足は書かないでください。

      【文書】
      {document}
  P4:
    note: カタカナ・専門用語寄りの語彙
    template: |
      以下のドキュメントから次の4アイテムをピックアップし、指定のフォーマットでアウトプットしてください。
      ・補助対象者
      ・補助率と補助上限額
      ・応募期間
      ・応募時に提出する書類
      フォーマットは、上記のアイテム名をラベルとした「項目名: 値」の4ラインです。各バリューは50字以内にリミットし、イントロや補足コメントは書かないでください。

      【文書】
      {document}
  P5:
    note: 口語的で曖昧な言い回し
    template: |
      この文書からさ、補助対象者、補助率と補助上限額、応募期間、応募時に提出する書類の4つを抜き出してほしいんだよね。その項目名を使って「項目名: 値」って感じで4行にしてくれる？値はそれぞれ50字以内で、前置きとか補足とかはなしでお願い。

      【文書】
      {document}
