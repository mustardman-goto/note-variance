# ============================================================
# 検証設定（2026-10-16_abstention：棄権指示の有無で、記載のない項目への答え方が変わるか）
# 2026w41 の設定は Git の履歴（755ff22 以前の config/run.yaml）に残っている
# ============================================================

run_id: "2026-10-16_abstention"
material:
  url: "https://www.archives.go.jp/guide/copy.html"
  # 指示文の materials/ は、このリポジトリの既存の置き場所 data/ に読み替えた
  local_path: "data/2026-10-16_archives_copy.txt"
  # 実際に取得した日時（2026-10-17 11:50 JST）。取得は1回だけ。元の HTML は data/source/（コミットしない）
  fetched_at: "2026-10-17"
  source_html: "data/source/2026-10-16_archives_copy/copy.html"
  # 本文の切り出し方: src/extract_html.py --start-class copy --stop-id FooterLayout --skip-class ikari
model:
  id: null            # 起動時に /v1/models から取得して埋める。決め打ち禁止
  family: "claude-sonnet"
temperature: 1.0      # 1本目・2本目と同一
max_tokens: 400
trials_per_condition: 20
items:                # この順序も固定
  - "利用請求書の提出方法"
  - "手数料の支払方法"
  - "成果物の送付費用の負担者"
  - "利用請求書の様式のファイル形式"
  - "写しの交付手数料の金額"
  - "1回の請求で申し込めるカット数の上限"
prompt:
  body: |
    以下の文書を読み、次の6項目を抽出してください。

    【項目】
    1. 利用請求書の提出方法
    2. 手数料の支払方法
    3. 成果物の送付費用の負担者
    4. 利用請求書の様式のファイル形式
    5. 写しの交付手数料の金額
    6. 1回の請求で申し込めるカット数の上限

    【出力形式】
    「項目名: 値」の形式で6行だけ出力してください。
    各行の値は40字以内。前置きや補足の文章は書かないでください。
    {abstention}

    【文書】
    {material}
  # {abstention} の位置は3条件で共通。ここ以外は1文字も変えないこと
conditions:
  - id: "C0"
    label: "棄権指示なし"
    abstention: ""
  - id: "C1"
    label: "記載なしと書くよう指示"
    abstention: "文書に記載がない項目は、値のかわりに「記載なし」とだけ書いてください。"
  - id: "C2"
    label: "推測禁止を明示"
    abstention: "推測で補わないでください。文書に根拠がある場合のみ値を書き、根拠がない場合は値のかわりに「記載なし」とだけ書いてください。"
output:
  # 生ログはこのリポジトリの既存の形 results/raw/<run_id>.jsonl に1件ずつ追記する
  # （指示文の results/raw/2026-10-16_abstention/ から読み替え）。manifest も同じ場所
  raw_path: "results/raw/2026-10-16_abstention.jsonl"
  append_per_call: true

# ---- ここから下は、ハーネスが動くために必要な設定（指示文に無いもの） ----

# 集計結果の出力先（既存の results/ と混ざらないよう run_id ごとに分ける）
output_dir: results/2026-10-16_abstention

# 正答判定の基準（ファイル名の ground_truth_ より後ろが集計結果のファイル名の末尾に付く）
ground_truth: config/ground_truth_abstention_v1.yaml

# 形式検査に使う値の字数上限（プロンプトの「各行の値は40字以内」と同じ数）
max_value_chars: 40

# リトライ（レート制限・サーバーエラー・通信エラーのとき）。指数バックオフ
retry:
  max_attempts: 6
  base_delay_sec: 2
  max_delay_sec: 60

# コスト試算用の単価（USD / 100万トークン）。2026w41 の設定から転記
pricing_usd_per_mtok:
  claude-opus-5-5:   {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5:  {input: 0.10, output: 0.50}
